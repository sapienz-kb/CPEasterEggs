<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Weather - secret creatures</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>

  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<h1>🌤 Weather Check</h1>
<input id="city" placeholder="Type a city name…"
       onkeydown="if(event.key==='Enter')checkWeather()">
<button onclick="checkWeather()">Go</button>
<div id="result">Waiting…</div>

     EASTER EGGS:
       type "dragon"   → a dragon flies across
       type "penguins" → penguins waddle across
       type "cloud"    → a giant cloud puffs in
     ═══════════════════════════════════════════ -->

  <script src="sketch.js"></script>
</body>
</html>
